services:
  - type: web
    name: mtx-api-staging
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: pnpm install --frozen-lockfile && pnpm check && pnpm test && pnpm build && node server/migrate.mjs
    startCommand: node --experimental-strip-types server/productionServer.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: TOKXTAPBOT
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: AUTH_MAX_AGE_SECONDS
        value: 300
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: TONCENTER_BASE_URL
        value: https://testnet.toncenter.com
      - key: TON_TREASURY_ADDRESS
        value: 0QD5l1aVXwQxVyvdvv_cAXEH89_9PI8blYMPElwWMQP27wKh
      - key: TON_PAYMENT_AMOUNT_NANO
        value: 10000000
      - key: TON_PAYMENT_CREDIT_MTX
        value: 100
      - key: POSTGRES_SSL
        value: true
      - key: POSTGRES_TLS_REJECT_UNAUTHORIZED
        value: true
      - key: POSTGRES_POOL_MAX
        value: 10
      - key: POSTGRES_CONNECT_TIMEOUT_MS
        value: 30000
      - key: POSTGRES_IDLE_TIMEOUT_MS
        value: 30000
      - key: REDIS_CONNECT_TIMEOUT_MS
        value: 30000
